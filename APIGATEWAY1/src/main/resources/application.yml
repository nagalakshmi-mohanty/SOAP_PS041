
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth,/auth/**

            - id: meter-service
              uri: lb://METER-SERVICE
              predicates:
                - Path=/meters,/meters/**

            - id: usage-service
              uri: lb://USAGE-SERVICE
              predicates:
                - Path=/usage,/usage/**

            - id: alert-service
              uri: lb://ALERT-SERVICE
              predicates:
                - Path=/alerts,/alerts/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
